<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=128,height=128">
<title>OpenCode Go Pacer icon 128</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 128px;
    height: 128px;
    overflow: hidden;
    background: #0f1220;
  }
  .icon {
    position: relative;
    width: 128px;
    height: 128px;
  }
  .ring-track,
  .ring-fill {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 12px solid #262b4a;
  }
  .ring-fill {
    border-color: transparent;
    border-top-color: #6ea8fe;
    border-right-color: #6ea8fe;
    transform: rotate(-58deg);
  }
</style>
</head>
<body>
  <main class="icon" aria-label="OpenCode Go Pacer icon">
    <div class="ring-track"></div>
    <div class="ring-fill"></div>
  </main>
</body>
</html>
